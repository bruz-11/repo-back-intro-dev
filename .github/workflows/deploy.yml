name: Deploy to AWS

on:
  push:
    branches: [ master ] # Se activa cuando mandas cambios a master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/
            if [ ! -d "Repo_Backends" ]; then
              git clone https://github.com/bruz-11/repo-back-intro-dev.git
            fi
            cd Repo_Backends
            git pull origin master
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
            echo "DB_USER=postgres" >> .env
            echo "DB_NAME=innovatech_db" >> .env
            echo "FRONT_IMAGE=bruz11/front-despacho:latest" >> .env
            docker-compose down
            docker-compose up -d --build